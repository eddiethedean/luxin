[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luxin"
version = "0.4.0"
description = "Streamlit-first interactive data exploration with drill-down capabilities for exploring aggregated data"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "luxin-core>=0.4.0,<0.5.0",
    "packaging>=21.0",
    "pandas>=1.3.0",
    "streamlit>=1.35.0",
]
license = { text = "MIT" }
keywords = ["dataframe", "visualization", "streamlit", "jupyter", "interactive", "drill-down", "data-exploration"]
authors = [
    {name = "Odos Matthews", email = "odosmatthews@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
]

[project.optional-dependencies]
notebook = ["luxin-nb>=0.4.0,<0.5.0"]
polars = ["polars>=0.20.0"]
compare = ["scipy>=1.7"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
    "scipy>=1.7",
]

[tool.setuptools]
packages = ["luxin", "luxin.components"]

# Monorepo: ty resolves first-party imports for sibling packages (see docs.astral.sh/ty/modules).
[tool.ty.environment]
extra-paths = ["luxin_core", "luxin_nb"]

[project.urls]
Repository = "https://github.com/eddiethedean/luxin"
Homepage = "https://github.com/eddiethedean/luxin"
"Bug Tracker" = "https://github.com/eddiethedean/luxin/issues"
