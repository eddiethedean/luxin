[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luxin-core"
version = "0.4.0"
description = "Core logic for Luxin: tracked aggregations, drill specs, and dataframe helpers"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
]
license = { text = "MIT" }
keywords = ["dataframe", "visualization", "interactive", "drill-down", "data-exploration"]
authors = [
    {name = "Odos Matthews", email = "odosmatthews@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
polars = ["polars>=0.20.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["luxin_core*"]

[project.urls]
Repository = "https://github.com/eddiethedean/luxin"
Homepage = "https://github.com/eddiethedean/luxin"
"Bug Tracker" = "https://github.com/eddiethedean/luxin/issues"
