[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luxin-nb"
version = "0.4.1"
description = "Jupyter notebook HTML drill-down for Luxin (luxin-core)"
requires-python = ">=3.8"
dependencies = [
    "luxin-core>=0.4.1,<0.5.0",
    "pandas>=1.3.0",
    "ipython>=7.0.0",
]
license = { text = "MIT" }
keywords = ["dataframe", "jupyter", "notebook", "interactive", "drill-down", "data-exploration"]
authors = [
    {name = "Odos Matthews", email = "odosmatthews@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["luxin_nb*"]

[tool.setuptools.package-data]
luxin_nb = [
    "static/*.css",
    "static/*.js",
    "templates/*.html",
]

[project.urls]
Repository = "https://github.com/eddiethedean/luxin"
Homepage = "https://github.com/eddiethedean/luxin"
Documentation = "https://luxin.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/eddiethedean/luxin/issues"
