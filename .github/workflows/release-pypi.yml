name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml luxin_core/pyproject.toml luxin_nb/pyproject.toml; do
            PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('$f', 'rb'))['project']['version'])")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' encodes '${TAG_VERSION}' but $f has version '${PKG_VERSION}'"
              exit 1
            fi
          done
          echo "Releasing version ${TAG_VERSION}"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheels
        run: |
          (cd luxin_core && python -m build --outdir ../dist)
          (cd luxin_nb && python -m build --outdir ../dist)
          python -m build --outdir dist

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations require Trusted Publishing (OIDC); token auth ignores them and logs noise.
          attestations: false
