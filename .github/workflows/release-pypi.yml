name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package versions
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          export TAG_VERSION
          for f in pyproject.toml luxin_core/pyproject.toml luxin_nb/pyproject.toml; do
            PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('$f', 'rb'))['project']['version'])")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' encodes '${TAG_VERSION}' but $f has version '${PKG_VERSION}'"
              exit 1
            fi
          done
          python3 <<'PY'
          import ast
          import os
          import pathlib

          tag = os.environ["TAG_VERSION"]
          paths = [
              pathlib.Path("luxin/__init__.py"),
              pathlib.Path("luxin_core/luxin_core/__init__.py"),
              pathlib.Path("luxin_nb/luxin_nb/__init__.py"),
          ]
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              found = None
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "__version__":
                              val = node.value
                              if isinstance(val, ast.Constant) and isinstance(val.value, str):
                                  found = val.value
                                  break
                  if found is not None:
                      break
              if found is None:
                  print(f"::error::No string __version__ assignment found in {path}")
                  raise SystemExit(1)
              if found != tag:
                  print(
                      f"::error::Tag encodes {tag!r} but {path} has __version__ = {found!r}"
                  )
                  raise SystemExit(1)
          PY
          echo "Releasing version ${TAG_VERSION}"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheels (luxin-core, luxin-nb, luxin)
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          (cd luxin_core && python -m build --outdir ../dist)
          (cd luxin_nb && python -m build --outdir ../dist)
          python -m build --outdir dist

      - name: List built artifacts
        run: |
          set -euo pipefail
          ls -la dist/
          echo "---"
          echo "luxin-core:" && ls -1 dist/luxin_core-* || { echo "::error::No luxin-core artifacts"; exit 1; }
          echo "luxin-nb:" && ls -1 dist/luxin_nb-* || { echo "::error::No luxin-nb artifacts"; exit 1; }
          echo "luxin:" && ls -1 dist/luxin-[0-9]* || { echo "::error::No luxin metapackage artifacts"; exit 1; }

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI (luxin-core, then luxin-nb, then luxin)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          # Upload in dependency order so each package exists before dependents resolve it.
          twine upload dist/luxin_core-* --non-interactive
          twine upload dist/luxin_nb-* --non-interactive
          # Match luxin-X.Y.Z only (not luxin_core / luxin_nb)
          twine upload dist/luxin-[0-9]* --non-interactive
