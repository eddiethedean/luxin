# If collection fails with async autouse fixtures from globally installed pytest plugins,
# run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/
# When using coverage, load the plugin explicitly:
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/ -p pytest_cov --cov=...
# (See README "Development setup" for test commands.)
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    streamlit: Tests that mock Streamlit UI (luxin)
    notebook: luxin_nb or Jupyter-oriented paths
    polars: Optionally requires Polars installed (exercise polars extras)
    slow: Slower or heavier tests
norecursedirs = .git .tox dist build site *.egg __pycache__ luxin-0.2.1
