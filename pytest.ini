# If collection fails with async autouse fixtures from globally installed pytest plugins,
# run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/
# (See README "Development setup" for test commands.)
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
